services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saas_catalog
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./src
      dockerfile: MultiTenantSaaS.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=saas_catalog;Username=saas;Password=saas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
volumes:
  postgres-data:
